<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#2a2520"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Roadmap path -->
  <g opacity="0.3" stroke="#b45837" fill="none" stroke-width="2" stroke-dasharray="6 6">
    <path d="M 80 350 Q 200 280 280 320 T 480 280 T 680 220 T 720 180"/>
  </g>
  <!-- Milestones -->
  <g fill="#b45837" opacity="0.8">
    <circle cx="80" cy="350" r="10"/>
    <circle cx="280" cy="320" r="10"/>
    <circle cx="480" cy="280" r="10"/>
    <circle cx="720" cy="180" r="10"/>
  </g>
  <g fill="#faf8f2" opacity="0.9">
    <text x="60" y="395" font-family="-apple-system, SF Mono" font-size="11" font-weight="600">M1</text>
    <text x="260" y="365" font-family="-apple-system, SF Mono" font-size="11" font-weight="600">M2</text>
    <text x="460" y="325" font-family="-apple-system, SF Mono" font-size="11" font-weight="600">M3</text>
    <text x="700" y="225" font-family="-apple-system, SF Mono" font-size="11" font-weight="600">M6</text>
  </g>
  <!-- Title -->
  <text x="60" y="120" font-family="-apple-system, SF Pro Display" font-size="14" font-weight="500" fill="#b45837" letter-spacing="2">NLP + GENAI · 2026</text>
  <text x="60" y="180" font-family="-apple-system, SF Pro Display" font-size="40" font-weight="700" fill="#faf8f2">Six months,</text>
  <text x="60" y="225" font-family="-apple-system, SF Pro Display" font-size="40" font-weight="700" fill="#faf8f2">one offer.</text>
  <text x="60" y="290" font-family="-apple-system, SF Pro Display" font-size="18" font-weight="400" fill="#c5c9cf" font-style="italic">From data scientist to GenAI data scientist.</text>
  <text x="60" y="370" font-family="-apple-system, SF Mono" font-size="11" font-weight="500" fill="#7a808a" letter-spacing="1.5">TRANSFORMER · RAG · AGENT · LORA · FINANCE</text>
</svg>