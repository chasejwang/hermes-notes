<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#e8e8ed"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 简洁的几何装饰 -->
  <g opacity="0.18">
    <rect x="120" y="120" width="80" height="80" fill="#0066cc" rx="2"/>
    <rect x="220" y="120" width="80" height="80" fill="#1d1d1f" rx="2"/>
    <rect x="320" y="120" width="80" height="80" fill="#0066cc" rx="2"/>
    <rect x="120" y="220" width="80" height="80" fill="#1d1d1f" rx="2"/>
    <rect x="220" y="220" width="80" height="80" fill="#0066cc" rx="2"/>
    <rect x="320" y="220" width="80" height="80" fill="#1d1d1f" rx="2"/>
    <rect x="120" y="320" width="80" height="80" fill="#0066cc" rx="2"/>
    <rect x="220" y="320" width="80" height="80" fill="#1d1d1f" rx="2"/>
    <rect x="320" y="320" width="80" height="80" fill="#0066cc" rx="2"/>
  </g>
  <text x="500" y="200" font-family="-apple-system, SF Pro Display" font-size="44" font-weight="700" fill="#1d1d1f">Memory</text>
  <text x="500" y="250" font-family="-apple-system, SF Pro Display" font-size="44" font-weight="700" fill="#0066cc">Cycle</text>
  <text x="500" y="310" font-family="-apple-system, SF Pro Display" font-size="20" font-weight="400" fill="#6e6e73">DRAM · NAND · HBM</text>
</svg>