<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f4e4d4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45837"/>
      <stop offset="100%" stop-color="#9c4a2c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- 4 pillar columns -->
  <g opacity="0.9">
    <!-- Col 1: Cluster (K-Means dots) -->
    <g transform="translate(280, 280)">
      <circle cx="0" cy="0" r="8" fill="#b45837"/>
      <circle cx="40" cy="20" r="8" fill="#b45837"/>
      <circle cx="-30" cy="40" r="8" fill="#b45837"/>
      <circle cx="20" cy="60" r="8" fill="#b45837"/>
      <circle cx="-20" cy="-30" r="8" fill="#b45837"/>
      <circle cx="60" cy="-20" r="8" fill="#b45837"/>
      <circle cx="100" cy="80" r="6" fill="#9a8e7e"/>
      <circle cx="140" cy="60" r="6" fill="#9a8e7e"/>
      <circle cx="160" cy="100" r="6" fill="#9a8e7e"/>
      <circle cx="120" cy="120" r="6" fill="#9a8e7e"/>
      <circle cx="200" cy="180" r="6" fill="#9a8e7e"/>
      <circle cx="240" cy="160" r="6" fill="#9a8e7e"/>
      <circle cx="220" cy="220" r="6" fill="#9a8e7e"/>
      <circle cx="280" cy="280" r="6" fill="#9a8e7e"/>
      <circle cx="320" cy="260" r="6" fill="#9a8e7e"/>
      <circle cx="340" cy="320" r="6" fill="#9a8e7e"/>
      <text x="-30" y="220" font-family="Georgia, serif" font-size="28" fill="#1a1814" font-style="italic" font-weight="600">聚类</text>
    </g>

    <!-- Col 2: Association (basket) -->
    <g transform="translate(620, 280)">
      <rect x="0" y="0" width="60" height="50" rx="4" fill="none" stroke="#b45837" stroke-width="2"/>
      <rect x="80" y="20" width="60" height="50" rx="4" fill="none" stroke="#b45837" stroke-width="2"/>
      <rect x="160" y="0" width="60" height="50" rx="4" fill="none" stroke="#b45837" stroke-width="2"/>
      <rect x="40" y="100" width="60" height="50" rx="4" fill="none" stroke="#b45837" stroke-width="2"/>
      <rect x="120" y="120" width="60" height="50" rx="4" fill="none" stroke="#b45837" stroke-width="2"/>
      <line x1="30" y1="50" x2="50" y2="100" stroke="#9a8e7e" stroke-width="1.5"/>
      <line x1="60" y1="50" x2="50" y2="100" stroke="#9a8e7e" stroke-width="1.5"/>
      <line x1="110" y1="70" x2="80" y2="100" stroke="#9a8e7e" stroke-width="1.5"/>
      <line x1="140" y1="70" x2="120" y2="120" stroke="#9a8e7e" stroke-width="1.5"/>
      <line x1="190" y1="50" x2="120" y2="120" stroke="#9a8e7e" stroke-width="1.5"/>
      <line x1="60" y1="50" x2="190" y2="50" stroke="#9a8e7e" stroke-width="1.5"/>
      <line x1="50" y1="100" x2="120" y2="120" stroke="#9a8e7e" stroke-width="1.5"/>
      <text x="-20" y="220" font-family="Georgia, serif" font-size="28" fill="#1a1814" font-style="italic" font-weight="600">关联</text>
    </g>

    <!-- Col 3: Logistic Regression (S-curve) -->
    <g transform="translate(960, 280)">
      <line x1="0" y1="180" x2="320" y2="180" stroke="#9a8e7e" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="180" stroke="#9a8e7e" stroke-width="1.5"/>
      <path d="M 0 180 Q 160 180 160 90 Q 160 0 320 0" fill="none" stroke="#b45837" stroke-width="3"/>
      <circle cx="50" cy="170" r="4" fill="#1a1814"/>
      <circle cx="100" cy="155" r="4" fill="#1a1814"/>
      <circle cx="140" cy="120" r="4" fill="#1a1814"/>
      <circle cx="170" cy="80" r="4" fill="#1a1814"/>
      <circle cx="200" cy="50" r="4" fill="#1a1814"/>
      <circle cx="240" cy="20" r="4" fill="#1a1814"/>
      <circle cx="280" cy="10" r="4" fill="#1a1814"/>
      <circle cx="60" cy="160" r="4" fill="#1a1814"/>
      <circle cx="120" cy="140" r="4" fill="#1a1814"/>
      <circle cx="220" cy="40" r="4" fill="#1a1814"/>
      <text x="-20" y="220" font-family="Georgia, serif" font-size="28" fill="#1a1814" font-style="italic" font-weight="600">逻辑回归</text>
    </g>

    <!-- Col 4: Decision Tree -->
    <g transform="translate(1300, 250)">
      <line x1="80" y1="0" x2="40" y2="60" stroke="#9a8e7e" stroke-width="1.5"/>
      <line x1="80" y1="0" x2="120" y2="60" stroke="#9a8e7e" stroke-width="1.5"/>
      <circle cx="80" cy="0" r="12" fill="none" stroke="#b45837" stroke-width="2"/>
      <line x1="40" y1="60" x2="20" y2="120" stroke="#9a8e7e" stroke-width="1.5"/>
      <line x1="40" y1="60" x2="60" y2="120" stroke="#9a8e7e" stroke-width="1.5"/>
      <circle cx="40" cy="60" r="10" fill="none" stroke="#b45837" stroke-width="2"/>
      <line x1="120" y1="60" x2="100" y2="120" stroke="#9a8e7e" stroke-width="1.5"/>
      <line x1="120" y1="60" x2="140" y2="120" stroke="#9a8e7e" stroke-width="1.5"/>
      <circle cx="120" cy="60" r="10" fill="none" stroke="#b45837" stroke-width="2"/>
      <rect x="6" y="120" width="28" height="22" rx="3" fill="#b45837"/>
      <rect x="46" y="120" width="28" height="22" rx="3" fill="#b45837"/>
      <rect x="86" y="120" width="28" height="22" rx="3" fill="#b45837"/>
      <rect x="126" y="120" width="28" height="22" rx="3" fill="#b45837"/>
      <text x="-30" y="220" font-family="Georgia, serif" font-size="28" fill="#1a1814" font-style="italic" font-weight="600">决策树</text>
    </g>
  </g>

  <!-- Title -->
  <text x="800" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="68" fill="#1a1814" font-style="italic" font-weight="600">商业分析四大支柱</text>
  <text x="800" y="760" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" fill="#6a5f52" letter-spacing="0.3em">聚类 / 关联 / 逻辑回归 / 决策树</text>

  <!-- Tag -->
  <rect x="640" y="800" width="320" height="32" rx="16" fill="url(#accent)"/>
  <text x="800" y="822" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#faf8f2" letter-spacing="0.3em" font-weight="600">D+18 · DATA SCIENTIST</text>
</svg>