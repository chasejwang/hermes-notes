<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf8f3"/>
      <stop offset="100%" stop-color="#f4e4d4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45837"/>
      <stop offset="100%" stop-color="#9c4a2c"/>
    </linearGradient>
    <radialGradient id="node1" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#b45837" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45837" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="node2" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#4a7c4e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4a7c4e" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- 因子相关性矩阵 (淡色背景) -->
  <g transform="translate(180,180)" opacity="0.5">
    <g stroke="#b45837" stroke-width="1" fill="none">
      <line x1="0" y1="0" x2="280" y2="0"/>
      <line x1="0" y1="40" x2="280" y2="40"/>
      <line x1="0" y1="80" x2="280" y2="80"/>
      <line x1="0" y1="120" x2="280" y2="120"/>
      <line x1="0" y1="160" x2="280" y2="160"/>
      <line x1="0" y1="200" x2="280" y2="200"/>
      <line x1="0" y1="240" x2="280" y2="240"/>
      <line x1="0" y1="280" x2="280" y2="280"/>
    </g>
    <g stroke="#b45837" stroke-width="1" fill="none">
      <line x1="0" y1="0" x2="0" y2="280"/>
      <line x1="40" y1="0" x2="40" y2="280"/>
      <line x1="80" y1="0" x2="80" y2="280"/>
      <line x1="120" y1="0" x2="120" y2="280"/>
      <line x1="160" y1="0" x2="160" y2="280"/>
      <line x1="200" y1="0" x2="200" y2="280"/>
      <line x1="240" y1="0" x2="240" y2="280"/>
      <line x1="280" y1="0" x2="280" y2="280"/>
    </g>
    <!-- 部分格涂色代表相关性 -->
    <rect x="0" y="0" width="40" height="40" fill="#b45837" opacity="0.4"/>
    <rect x="40" y="40" width="40" height="40" fill="#b45837" opacity="0.6"/>
    <rect x="80" y="80" width="40" height="40" fill="#b45837" opacity="0.8"/>
    <rect x="120" y="120" width="40" height="40" fill="#b45837" opacity="0.6"/>
    <rect x="160" y="160" width="40" height="40" fill="#b45837" opacity="0.4"/>
    <rect x="200" y="200" width="40" height="40" fill="#b45837" opacity="0.3"/>
    <rect x="240" y="240" width="40" height="40" fill="#b45837" opacity="0.2"/>
  </g>

  <!-- 3 个项目节点 + 连线 (awesome-quant → ml4trading → alphalens) -->
  <g>
    <!-- 节点 1: awesome-quant (左侧) -->
    <circle cx="780" cy="450" r="85" fill="url(#node1)"/>
    <circle cx="780" cy="450" r="55" fill="#b45837"/>
    <text x="780" y="458" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#faf8f3" font-weight="700">awesome</text>
    <text x="780" y="478" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#faf8f3" font-weight="700">-quant</text>

    <!-- 节点 2: ml4trading Ch8 (中间) -->
    <circle cx="1080" cy="280" r="100" fill="url(#node2)"/>
    <circle cx="1080" cy="280" r="65" fill="#4a7c4e"/>
    <text x="1080" y="278" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#faf8f3" font-weight="700">Ch 8</text>
    <text x="1080" y="298" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#faf8f3" font-weight="700">Feature</text>
    <text x="1080" y="316" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#faf8f3" font-weight="700">Eng.</text>

    <!-- 节点 3: alphalens (右下) -->
    <circle cx="1380" cy="620" r="95" fill="url(#node1)"/>
    <circle cx="1380" cy="620" r="62" fill="#b45837"/>
    <text x="1380" y="618" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#faf8f3" font-weight="700">alpha</text>
    <text x="1380" y="638" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#faf8f3" font-weight="700">-lens</text>

    <!-- 连线: 1→2, 2→3 -->
    <line x1="855" y1="420" x2="1000" y2="310" stroke="#b45837" stroke-width="3" opacity="0.6" stroke-dasharray="6,4"/>
    <line x1="1130" y1="320" x2="1320" y2="580" stroke="#b45837" stroke-width="3" opacity="0.6" stroke-dasharray="6,4"/>

    <!-- 箭头标签 -->
    <text x="900" y="358" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#7a6a55" font-style="italic">build</text>
    <text x="1240" y="450" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#7a6a55" font-style="italic">evaluate</text>
  </g>

  <!-- 几个特征节点散落 (代表 Ch 8 的 feature family) -->
  <g opacity="0.55">
    <circle cx="200" cy="700" r="6" fill="#4a7c4e"/>
    <text x="215" y="705" font-family="-apple-system, sans-serif" font-size="11" fill="#6a5f52">momentum</text>
    <circle cx="320" cy="700" r="6" fill="#4a7c4e"/>
    <text x="335" y="705" font-family="-apple-system, sans-serif" font-size="11" fill="#6a5f52">value</text>
    <circle cx="430" cy="700" r="6" fill="#4a7c4e"/>
    <text x="445" y="705" font-family="-apple-system, sans-serif" font-size="11" fill="#6a5f52">carry</text>
    <circle cx="540" cy="700" r="6" fill="#4a7c4e"/>
    <text x="555" y="705" font-family="-apple-system, sans-serif" font-size="11" fill="#6a5f52">quality</text>
    <circle cx="650" cy="700" r="6" fill="#4a7c4e"/>
    <text x="665" y="705" font-family="-apple-system, sans-serif" font-size="11" fill="#6a5f52">volatility</text>
    <circle cx="780" cy="700" r="6" fill="#4a7c4e"/>
    <text x="795" y="705" font-family="-apple-system, sans-serif" font-size="11" fill="#6a5f52">liquidity</text>
  </g>

  <!-- 标题 -->
  <text x="800" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="58" fill="#1a1814" font-style="italic" font-weight="600">量化因子 3 大项目</text>
  <text x="800" y="138" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#6a5f52" letter-spacing="0.18em">awesome-quant  ·  ml4trading Ch 8  ·  alphalens</text>

  <!-- Tag -->
  <rect x="640" y="800" width="320" height="32" rx="16" fill="url(#accent)"/>
  <text x="800" y="822" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#faf8f2" letter-spacing="0.3em" font-weight="600">D+18 · QUANT FACTOR PIPELINE</text>
</svg>