<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f4e4d4"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#1c1a17" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- 100 dot grid (Lieflat #1 signature) -->
  <g transform="translate(80, 200)">
    <!-- row 0 -->
    <circle cx="0" cy="0" r="6" fill="#1c1a17"/><circle cx="40" cy="0" r="6" fill="#1c1a17"/><circle cx="80" cy="0" r="6" fill="#1c1a17"/><circle cx="120" cy="0" r="6" fill="#1c1a17"/><circle cx="160" cy="0" r="6" fill="#1c1a17"/><circle cx="200" cy="0" r="6" fill="#1c1a17"/><circle cx="240" cy="0" r="6" fill="#1c1a17"/><circle cx="280" cy="0" r="6" fill="#1c1a17"/><circle cx="320" cy="0" r="6" fill="#1c1a17"/><circle cx="360" cy="0" r="6" fill="#1c1a17"/>
    <!-- row 1 -->
    <circle cx="0" cy="40" r="6" fill="#1c1a17"/><circle cx="40" cy="40" r="6" fill="#1c1a17"/><circle cx="80" cy="40" r="6" fill="#1c1a17"/><circle cx="120" cy="40" r="6" fill="#1c1a17"/><circle cx="160" cy="40" r="6" fill="#1c1a17"/><circle cx="200" cy="40" r="6" fill="#1c1a17"/><circle cx="240" cy="40" r="6" fill="#1c1a17"/><circle cx="280" cy="40" r="6" fill="#1c1a17"/><circle cx="320" cy="40" r="6" fill="#1c1a17"/><circle cx="360" cy="40" r="6" fill="#1c1a17"/>
    <!-- row 2 -->
    <circle cx="0" cy="80" r="6" fill="#1c1a17"/><circle cx="40" cy="80" r="6" fill="#1c1a17"/><circle cx="80" cy="80" r="6" fill="#1c1a17"/><circle cx="120" cy="80" r="6" fill="#1c1a17"/><circle cx="160" cy="80" r="6" fill="#1c1a17"/><circle cx="200" cy="80" r="6" fill="#1c1a17"/><circle cx="240" cy="80" r="6" fill="#1c1a17"/><circle cx="280" cy="80" r="6" fill="#1c1a17"/><circle cx="320" cy="80" r="6" fill="#1c1a17"/><circle cx="360" cy="80" r="6" fill="#1c1a17"/>
    <!-- row 3: 7 black + 3 grey -->
    <circle cx="0" cy="120" r="6" fill="#1c1a17"/><circle cx="40" cy="120" r="6" fill="#1c1a17"/><circle cx="80" cy="120" r="6" fill="#1c1a17"/><circle cx="120" cy="120" r="6" fill="#1c1a17"/><circle cx="160" cy="120" r="6" fill="#1c1a17"/><circle cx="200" cy="120" r="6" fill="#1c1a17"/><circle cx="240" cy="120" r="6" fill="#1c1a17"/><circle cx="280" cy="120" r="6" fill="#a8a39a"/><circle cx="320" cy="120" r="6" fill="#a8a39a"/><circle cx="360" cy="120" r="6" fill="#a8a39a"/>
    <!-- row 4 -->
    <circle cx="0" cy="160" r="6" fill="#1c1a17"/><circle cx="40" cy="160" r="6" fill="#1c1a17"/><circle cx="80" cy="160" r="6" fill="#1c1a17"/><circle cx="120" cy="160" r="6" fill="#1c1a17"/><circle cx="160" cy="160" r="6" fill="#1c1a17"/><circle cx="200" cy="160" r="6" fill="#1c1a17"/><circle cx="240" cy="160" r="6" fill="#1c1a17"/><circle cx="280" cy="160" r="6" fill="#1c1a17"/><circle cx="320" cy="160" r="6" fill="#1c1a17"/><circle cx="360" cy="160" r="6" fill="#1c1a17"/>
    <!-- row 5 -->
    <circle cx="0" cy="200" r="6" fill="#1c1a17"/><circle cx="40" cy="200" r="6" fill="#1c1a17"/><circle cx="80" cy="200" r="6" fill="#1c1a17"/><circle cx="120" cy="200" r="6" fill="#1c1a17"/><circle cx="160" cy="200" r="6" fill="#1c1a17"/><circle cx="200" cy="200" r="6" fill="#1c1a17"/><circle cx="240" cy="200" r="6" fill="#1c1a17"/><circle cx="280" cy="200" r="6" fill="#1c1a17"/><circle cx="320" cy="200" r="6" fill="#1c1a17"/><circle cx="360" cy="200" r="6" fill="#1c1a17"/>
    <!-- row 6: 8 black + 2 grey -->
    <circle cx="0" cy="240" r="6" fill="#1c1a17"/><circle cx="40" cy="240" r="6" fill="#1c1a17"/><circle cx="80" cy="240" r="6" fill="#1c1a17"/><circle cx="120" cy="240" r="6" fill="#1c1a17"/><circle cx="160" cy="240" r="6" fill="#1c1a17"/><circle cx="200" cy="240" r="6" fill="#1c1a17"/><circle cx="240" cy="240" r="6" fill="#1c1a17"/><circle cx="280" cy="240" r="6" fill="#1c1a17"/><circle cx="320" cy="240" r="6" fill="#a8a39a"/><circle cx="360" cy="240" r="6" fill="#a8a39a"/>
    <!-- row 7: 4 black + 6 grey -->
    <circle cx="0" cy="280" r="6" fill="#1c1a17"/><circle cx="40" cy="280" r="6" fill="#1c1a17"/><circle cx="80" cy="280" r="6" fill="#1c1a17"/><circle cx="120" cy="280" r="6" fill="#1c1a17"/><circle cx="160" cy="280" r="6" fill="#a8a39a"/><circle cx="200" cy="280" r="6" fill="#a8a39a"/><circle cx="240" cy="280" r="6" fill="#a8a39a"/><circle cx="280" cy="280" r="6" fill="#a8a39a"/><circle cx="320" cy="280" r="6" fill="#a8a39a"/><circle cx="360" cy="280" r="6" fill="#a8a39a"/>
    <!-- row 8: 2 black + 8 grey -->
    <circle cx="0" cy="320" r="6" fill="#1c1a17"/><circle cx="40" cy="320" r="6" fill="#1c1a17"/><circle cx="80" cy="320" r="6" fill="#a8a39a"/><circle cx="120" cy="320" r="6" fill="#a8a39a"/><circle cx="160" cy="320" r="6" fill="#a8a39a"/><circle cx="200" cy="320" r="6" fill="#a8a39a"/><circle cx="240" cy="320" r="6" fill="#a8a39a"/><circle cx="280" cy="320" r="6" fill="#a8a39a"/><circle cx="320" cy="320" r="6" fill="#a8a39a"/><circle cx="360" cy="320" r="6" fill="#a8a39a"/>
  </g>

  <!-- Brand line + accent dot -->
  <g transform="translate(720, 220)">
    <circle cx="0" cy="0" r="8" fill="#b45837"/>
  </g>

  <!-- Title typography -->
  <text x="720" y="350" font-family="Georgia, serif" font-style="italic" font-size="42" fill="#1c1a17" font-weight="400">Context Engineering</text>
  <text x="720" y="410" font-family="Georgia, serif" font-size="42" fill="#1c1a17" font-weight="400">from Prompt to Skill</text>

  <!-- Divider -->
  <line x1="720" y1="450" x2="900" y2="450" stroke="#b45837" stroke-width="2"/>

  <!-- Subtitle -->
  <text x="720" y="500" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#6a5f52">Why "good prompt" is no longer enough.</text>
  <text x="720" y="530" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#6a5f52">And what 8 best practice look like.</text>

  <!-- Brand mark + meta -->
  <text x="720" y="660" font-family="monospace" font-size="13" letter-spacing="3" fill="#1c1a17">HERMES AGENT</text>
  <text x="720" y="685" font-family="monospace" font-size="13" letter-spacing="3" fill="#9a8e7e">2026 · 08 · 07</text>

  <!-- 4-Q series tag -->
  <g transform="translate(1300, 100)">
    <rect x="0" y="0" width="220" height="40" fill="none" stroke="#b45837" stroke-width="1"/>
    <text x="110" y="26" font-family="monospace" font-size="11" letter-spacing="2" fill="#b45837" text-anchor="middle">FROM 4-Q SERIES</text>
  </g>
</svg>
