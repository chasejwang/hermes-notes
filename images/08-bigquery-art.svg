<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f4e4d4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Cloud (Biquotient + OneLake = two cloud shapes interlinking) -->
  <ellipse cx="450" cy="350" rx="220" ry="120" fill="#1a1814"/>
  <ellipse cx="700" cy="380" rx="280" ry="150" fill="#b45837"/>
  <ellipse cx="1000" cy="330" rx="200" ry="110" fill="#1a1814" opacity="0.85"/>
  <ellipse cx="1200" cy="400" rx="180" ry="100" fill="#b45837" opacity="0.7"/>

  <!-- Data flow lines connecting them (dashed = query federation) -->
  <line x1="450" y1="350" x2="700" y2="380" stroke="#faf8f2" stroke-width="4" stroke-dasharray="20,8"/>
  <line x1="700" y1="380" x2="1000" y2="330" stroke="#faf8f2" stroke-width="4" stroke-dasharray="20,8"/>
  <line x1="1000" y1="330" x2="1200" y2="400" stroke="#faf8f2" stroke-width="4" stroke-dasharray="20,8"/>

  <!-- Bottom: data lake representation (horizontal bands) -->
  <rect x="0" y="640" width="1600" height="40" fill="#1a1814"/>
  <rect x="0" y="700" width="1600" height="20" fill="#b45837"/>
  <rect x="0" y="740" width="1600" height="10" fill="#1a1814" opacity="0.5"/>
  <rect x="0" y="770" width="1600" height="6" fill="#b45837" opacity="0.7"/>

  <!-- Three paths indicator (matching article "三条路径") -->
  <polygon points="100,640 300,640 250,580 150,580" fill="#1a1814"/>
  <polygon points="650,640 850,640 800,580 700,580" fill="#b45837"/>
  <polygon points="1200,640 1400,640 1350,580 1250,580" fill="#1a1814"/>

  <!-- Connection lines from clouds to paths -->
  <line x1="200" y1="580" x2="200" y2="540" stroke="#1a1814" stroke-width="3"/>
  <line x1="750" y1="580" x2="750" y2="540" stroke="#b45837" stroke-width="3"/>
  <line x1="1300" y1="580" x2="1300" y2="540" stroke="#1a1814" stroke-width="3"/>

  <!-- Title -->
  <text x="60" y="80" font-family="-apple-system, SF Pro Display, serif" font-size="20" font-weight="600" fill="#b45837" letter-spacing="3">DATA · CROSS-CLOUD · 2026</text>
  <text x="60" y="200" font-family="-apple-system, SF Pro Display, serif" font-size="60" font-weight="700" fill="#1a1814">BigQuery</text>
  <text x="60" y="270" font-family="-apple-system, SF Pro Display, serif" font-size="60" font-weight="700" fill="#1a1814">× OneLake</text>
  <text x="60" y="500" font-family="-apple-system, SF Pro Display, serif" font-size="22" font-weight="500" fill="#1a1814" opacity="0.75">三条路径：open lakehouse · federation · mirror</text>
</svg>
