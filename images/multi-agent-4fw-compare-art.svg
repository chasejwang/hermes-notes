<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45837" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a1a1a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#1a1a1a" stroke-width="0.5">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- 4 framework nodes in a horizontal row, with their protocol labels -->
  <!-- Node 1: LangGraph (green, winner — real run) -->
  <g transform="translate(160, 360)">
    <text x="0" y="-90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#6a6a6a" letter-spacing="2">REAL RUN</text>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#2d6a4f" stroke-width="2.5"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d6a4f" font-weight="bold">LG</text>
    <text x="0" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#2d6a4f">5/5</text>
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">LangGraph</text>
    <text x="0" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#6a6a6a">Send() parallel</text>
  </g>

  <!-- Node 2: AutoGen (green, winner — real run) -->
  <g transform="translate(480, 360)">
    <text x="0" y="-90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#6a6a6a" letter-spacing="2">REAL RUN</text>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#2d6a4f" stroke-width="2.5"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d6a4f" font-weight="bold">AG</text>
    <text x="0" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#2d6a4f">5/5</text>
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">AutoGen 0.7</text>
    <text x="0" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#6a6a6a">RoundRobin · 68.3s</text>
  </g>

  <!-- Node 3: CrewAI (yellow, fallback) -->
  <g transform="translate(800, 360)">
    <text x="0" y="-90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#f59e0b" letter-spacing="2">FALLBACK</text>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#f59e0b" font-weight="bold">CA</text>
    <text x="0" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#f59e0b">5/5</text>
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">CrewAI</text>
    <text x="0" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#6a6a6a">package install timeout</text>
  </g>

  <!-- Node 4: Swarm (yellow, fallback) -->
  <g transform="translate(1120, 360)">
    <text x="0" y="-90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#f59e0b" letter-spacing="2">FALLBACK</text>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#f59e0b" font-weight="bold">SW</text>
    <text x="0" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#f59e0b">5/5</text>
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Swarm</text>
    <text x="0" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#6a6a6a">no OpenAI endpoint</text>
  </g>

  <!-- Connection lines under each (subtle) showing they all converge to same Anthropic endpoint -->
  <g stroke="#1a1a1a" stroke-width="1.2" opacity="0.35">
    <line x1="160" y1="470" x2="640" y2="580"/>
    <line x1="480" y1="470" x2="640" y2="580"/>
    <line x1="800" y1="470" x2="640" y2="580"/>
    <line x1="1120" y1="470" x2="640" y2="580"/>
  </g>

  <!-- Convergence node -->
  <g transform="translate(640, 620)">
    <circle cx="0" cy="0" r="38" fill="#1a1a1a" opacity="0.9"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#faf8f2" font-weight="bold">API</text>
    <text x="0" y="56" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#6a6a6a">/anthropic · MiniMax-CN</text>
  </g>

  <!-- Title bar at top -->
  <text x="640" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1a1a1a" font-weight="bold">4 Framework · 1 Night · 100 Briefs</text>
  <text x="640" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#6a6a6a" font-style="italic">Day 4 of the 100-day sprint · 5 companies × 5 sections × 4 frameworks</text>
</svg>