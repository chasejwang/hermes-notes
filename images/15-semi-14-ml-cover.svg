<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f4e4d4"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#3d342a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Background grid (silicon wafer pattern) -->
  <g opacity="0.06">
    <line x1="0" y1="100" x2="1600" y2="100" stroke="#1a1814" stroke-width="1"/>
    <line x1="0" y1="200" x2="1600" y2="200" stroke="#1a1814" stroke-width="1"/>
    <line x1="0" y1="300" x2="1600" y2="300" stroke="#1a1814" stroke-width="1"/>
    <line x1="0" y1="400" x2="1600" y2="400" stroke="#1a1814" stroke-width="1"/>
    <line x1="0" y1="500" x2="1600" y2="500" stroke="#1a1814" stroke-width="1"/>
    <line x1="0" y1="600" x2="1600" y2="600" stroke="#1a1814" stroke-width="1"/>
    <line x1="0" y1="700" x2="1600" y2="700" stroke="#1a1814" stroke-width="1"/>
    <line x1="0" y1="800" x2="1600" y2="800" stroke="#1a1814" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="900" stroke="#1a1814" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="900" stroke="#1a1814" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="900" stroke="#1a1814" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="900" stroke="#1a1814" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="900" stroke="#1a1814" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="900" stroke="#1a1814" stroke-width="1"/>
    <line x1="1400" y1="0" x2="1400" y2="900" stroke="#1a1814" stroke-width="1"/>
  </g>

  <!-- 14 chips in a grid representing the 14 龙头 -->
  <g transform="translate(160, 250)">
    <!-- Row 1: 5 chips -->
    <rect x="0" y="0" width="120" height="120" fill="url(#chip)" rx="4"/>
    <rect x="140" y="0" width="120" height="120" fill="url(#chip)" rx="4"/>
    <rect x="280" y="0" width="120" height="120" fill="url(#chip)" rx="4"/>
    <rect x="420" y="0" width="120" height="120" fill="url(#chip)" rx="4"/>
    <rect x="560" y="0" width="120" height="120" fill="url(#chip)" rx="4"/>

    <!-- Row 2: 5 chips -->
    <rect x="0" y="160" width="120" height="120" fill="url(#chip)" rx="4"/>
    <rect x="140" y="160" width="120" height="120" fill="#b45837" rx="4"/>
    <rect x="280" y="160" width="120" height="120" fill="url(#chip)" rx="4"/>
    <rect x="420" y="160" width="120" height="120" fill="url(#chip)" rx="4"/>
    <rect x="560" y="160" width="120" height="120" fill="url(#chip)" rx="4"/>

    <!-- Row 3: 4 chips -->
    <rect x="0" y="320" width="120" height="120" fill="url(#chip)" rx="4"/>
    <rect x="140" y="320" width="120" height="120" fill="url(#chip)" rx="4"/>
    <rect x="280" y="320" width="120" height="120" fill="url(#chip)" rx="4"/>
    <rect x="420" y="320" width="120" height="120" fill="#b45837" rx="4"/>

    <!-- Connector lines (data flow between chips) -->
    <g stroke="#b45837" stroke-width="2" fill="none" opacity="0.7">
      <path d="M 60,120 L 60,160"/>
      <path d="M 200,120 L 200,160"/>
      <path d="M 340,120 L 340,160"/>
      <path d="M 480,120 L 480,160"/>
      <path d="M 620,120 L 620,160"/>
      <path d="M 60,280 L 60,320"/>
      <path d="M 340,280 L 340,320"/>
      <path d="M 480,280 L 480,320"/>
      <path d="M 620,280 L 620,320"/>
    </g>

    <!-- Highlight 2 winners (orange) -->
    <g fill="#b45837" opacity="0.3">
      <rect x="140" y="160" width="120" height="120" rx="4"/>
      <rect x="420" y="320" width="120" height="120" rx="4"/>
    </g>

    <!-- ML signal waves from orange chips -->
    <g stroke="#b45837" stroke-width="1.5" fill="none" opacity="0.5">
      <path d="M 200,220 Q 350,220 500,220"/>
      <path d="M 480,380 Q 350,380 200,380"/>
    </g>

    <!-- Top 3 label -->
    <g transform="translate(140, 100)">
      <text x="0" y="0" font-family="-apple-system, SF Pro Display" font-size="11" font-weight="700" fill="#fff" letter-spacing="2">TOP 3</text>
    </g>
    <g transform="translate(420, 420)">
      <text x="0" y="0" font-family="-apple-system, SF Pro Display" font-size="11" font-weight="700" fill="#fff" letter-spacing="2">TOP 2</text>
    </g>
  </g>

  <!-- Title -->
  <text x="60" y="80" font-family="-apple-system, SF Pro Display" font-size="20" font-weight="600" fill="#b45837" letter-spacing="3">QUANT · ML · 14 DRAGONS · 2026</text>

  <!-- Connection visualization on right -->
  <g transform="translate(900, 250)">
    <!-- Factor nodes -->
    <g>
      <circle cx="80" cy="80" r="40" fill="#1a1814" opacity="0.9"/>
      <text x="80" y="86" font-family="-apple-system, SF Pro Display" font-size="11" font-weight="600" fill="#faf8f2" text-anchor="middle">VOLUME</text>
      <text x="80" y="100" font-family="-apple-system, SF Pro Display" font-size="9" fill="#faf8f2" text-anchor="middle">z-score</text>

      <circle cx="240" cy="80" r="40" fill="#1a1814" opacity="0.9"/>
      <text x="240" y="86" font-family="-apple-system, SF Pro Display" font-size="11" font-weight="600" fill="#faf8f2" text-anchor="middle">52W LOW</text>
      <text x="240" y="100" font-family="-apple-system, SF Pro Display" font-size="9" fill="#faf8f2" text-anchor="middle">ratio</text>

      <circle cx="400" cy="80" r="40" fill="#1a1814" opacity="0.9"/>
      <text x="400" y="86" font-family="-apple-system, SF Pro Display" font-size="11" font-weight="600" fill="#faf8f2" text-anchor="middle">MOM 60</text>
      <text x="400" y="100" font-family="-apple-system, SF Pro Display" font-size="9" fill="#faf8f2" text-anchor="middle">3-month</text>

      <circle cx="560" cy="80" r="40" fill="#1a1814" opacity="0.9"/>
      <text x="560" y="86" font-family="-apple-system, SF Pro Display" font-size="11" font-weight="600" fill="#faf8f2" text-anchor="middle">VOL 60</text>
      <text x="560" y="100" font-family="-apple-system, SF Pro Display" font-size="9" fill="#faf8f2" text-anchor="middle">sigma</text>
    </g>

    <!-- ML model box -->
    <g transform="translate(160, 200)">
      <rect x="0" y="0" width="320" height="100" fill="#b45837" rx="4"/>
      <text x="160" y="50" font-family="-apple-system, SF Pro Display" font-size="22" font-weight="700" fill="#faf8f2" text-anchor="middle">LightGBM</text>
      <text x="160" y="76" font-family="-apple-system, SF Pro Display" font-size="13" fill="#faf8f2" text-anchor="middle" opacity="0.85">18-month walk-forward · IC +0.045</text>
    </g>

    <!-- Connection lines -->
    <g stroke="#1a1814" stroke-width="1.5" fill="none" opacity="0.5">
      <line x1="80" y1="120" x2="200" y2="200"/>
      <line x1="240" y1="120" x2="280" y2="200"/>
      <line x1="400" y1="120" x2="360" y2="200"/>
      <line x1="560" y1="120" x2="440" y2="200"/>
    </g>

    <!-- Output -->
    <g transform="translate(160, 360)">
      <rect x="0" y="0" width="320" height="80" fill="#1a1814" rx="4"/>
      <text x="160" y="36" font-family="-apple-system, SF Pro Display" font-size="14" font-weight="600" fill="#faf8f2" text-anchor="middle">Top 10% portfolio</text>
      <text x="160" y="60" font-family="-apple-system, SF Pro Display" font-size="28" font-weight="700" fill="#b45837" text-anchor="middle">+76.92% / yr</text>
    </g>

    <!-- Arrow -->
    <line x1="320" y1="300" x2="320" y2="360" stroke="#1a1814" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#1a1814"/>
    </marker>
  </defs>

  <!-- Bottom footer text -->
  <text x="60" y="830" font-family="-apple-system, SF Pro Display" font-size="13" font-weight="500" fill="#1a1814" opacity="0.6">14 A-share semiconductor leaders · 26 alpha factors · 624 trading days · OOS walk-forward</text>
</svg>
