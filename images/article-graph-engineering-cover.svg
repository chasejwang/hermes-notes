<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45837"/>
      <stop offset="50%" stop-color="#d97a3f"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <linearGradient id="node1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26827c"/>
      <stop offset="100%" stop-color="#1a5f5a"/>
    </linearGradient>
    <linearGradient id="node2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#4834d4"/>
    </linearGradient>
    <linearGradient id="node3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45837"/>
      <stop offset="100%" stop-color="#8a3a23"/>
    </linearGradient>
    <linearGradient id="node4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- 装饰网格点 -->
  <g opacity="0.08">
    <circle cx="200" cy="200" r="2" fill="#fff"/>
    <circle cx="400" cy="200" r="2" fill="#fff"/>
    <circle cx="600" cy="200" r="2" fill="#fff"/>
    <circle cx="800" cy="200" r="2" fill="#fff"/>
    <circle cx="1000" cy="200" r="2" fill="#fff"/>
    <circle cx="1200" cy="200" r="2" fill="#fff"/>
    <circle cx="1400" cy="200" r="2" fill="#fff"/>
    <circle cx="200" cy="700" r="2" fill="#fff"/>
    <circle cx="400" cy="700" r="2" fill="#fff"/>
    <circle cx="600" cy="700" r="2" fill="#fff"/>
    <circle cx="800" cy="700" r="2" fill="#fff"/>
    <circle cx="1000" cy="700" r="2" fill="#fff"/>
    <circle cx="1200" cy="700" r="2" fill="#fff"/>
    <circle cx="1400" cy="700" r="2" fill="#fff"/>
  </g>

  <!-- 标题区 -->
  <text x="80" y="160" font-family="-apple-system, sans-serif" font-size="56" font-weight="800" fill="#fafaf5" letter-spacing="-0.02em">
    Graph Engineering
  </text>
  <text x="80" y="220" font-family="-apple-system, sans-serif" font-size="22" font-weight="400" fill="#888">
    AI agent 工程的下一阶段 · 4-Q 研究笔记
  </text>

  <!-- 副标题装饰线 -->
  <line x1="80" y1="248" x2="280" y2="248" stroke="url(#accent)" stroke-width="3"/>

  <!-- 元数据标签 -->
  <g font-family="-apple-system, sans-serif" font-size="14" fill="#666">
    <text x="80" y="290">D+10 · 2026-08-12</text>
    <text x="240" y="290">·</text>
    <text x="260" y="290">4 个核心项目</text>
    <text x="400" y="290">·</text>
    <text x="420" y="290">~2500 字</text>
  </g>

  <!-- Knowledge Graph (左) -->
  <g transform="translate(80, 380)">
    <text font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#26827c" letter-spacing="0.05em">
      KNOWLEDGE GRAPH
    </text>
    <text y="28" font-family="-apple-system, sans-serif" font-size="13" fill="#999">
      agents remember
    </text>
    <!-- 节点 -->
    <circle cx="60" cy="120" r="40" fill="url(#node1)" opacity="0.9"/>
    <text x="60" y="124" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">entity</text>

    <circle cx="240" cy="120" r="40" fill="url(#node1)" opacity="0.7"/>
    <text x="240" y="124" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">fact</text>

    <circle cx="150" cy="240" r="40" fill="url(#node1)" opacity="0.85"/>
    <text x="150" y="244" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">time</text>

    <!-- 边 -->
    <line x1="100" y1="120" x2="200" y2="120" stroke="#26827c" stroke-width="2" opacity="0.6"/>
    <line x1="60" y1="160" x2="150" y2="200" stroke="#26827c" stroke-width="2" opacity="0.6"/>
    <line x1="240" y1="160" x2="150" y2="200" stroke="#26827c" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Task Graph (右) -->
  <g transform="translate(880, 380)">
    <text font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#b45837" letter-spacing="0.05em">
      TASK GRAPH
    </text>
    <text y="28" font-family="-apple-system, sans-serif" font-size="13" fill="#999">
      agents work
    </text>
    <!-- 节点 (5 节点) -->
    <circle cx="40" cy="100" r="32" fill="url(#node2)" opacity="0.9"/>
    <text x="40" y="104" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">collect</text>

    <circle cx="180" cy="60" r="32" fill="url(#node2)" opacity="0.9"/>
    <text x="180" y="64" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">verify</text>

    <circle cx="320" cy="60" r="32" fill="url(#node2)" opacity="0.9"/>
    <text x="320" y="64" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">verify</text>

    <circle cx="180" cy="180" r="32" fill="url(#node2)" opacity="0.9"/>
    <text x="180" y="184" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">refine</text>

    <circle cx="320" cy="180" r="32" fill="url(#node2)" opacity="0.9"/>
    <text x="320" y="184" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">refine</text>

    <!-- Score (中间大节点) -->
    <circle cx="500" cy="120" r="40" fill="url(#node3)" opacity="1"/>
    <text x="500" y="124" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">score</text>

    <!-- Human gate (右下) -->
    <circle cx="500" cy="260" r="36" fill="url(#node4)" opacity="0.95"/>
    <text x="500" y="258" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">human</text>
    <text x="500" y="270" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">gate</text>

    <!-- 边 (fan-out + converge) -->
    <line x1="72" y1="100" x2="148" y2="68" stroke="#6c5ce7" stroke-width="2" opacity="0.7"/>
    <line x1="72" y1="100" x2="148" y2="68" stroke="#6c5ce7" stroke-width="2" opacity="0.7"/>
    <line x1="72" y1="100" x2="148" y2="188" stroke="#6c5ce7" stroke-width="2" opacity="0.7"/>
    <line x1="72" y1="100" x2="148" y2="188" stroke="#6c5ce7" stroke-width="2" opacity="0.7"/>

    <line x1="212" y1="60" x2="460" y2="105" stroke="#6c5ce7" stroke-width="2" opacity="0.7"/>
    <line x1="352" y1="60" x2="460" y2="105" stroke="#6c5ce7" stroke-width="2" opacity="0.7"/>
    <line x1="212" y1="180" x2="460" y2="135" stroke="#6c5ce7" stroke-width="2" opacity="0.7"/>
    <line x1="352" y1="180" x2="460" y2="135" stroke="#6c5ce7" stroke-width="2" opacity="0.7"/>

    <line x1="540" y1="125" x2="500" y2="225" stroke="#b45837" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- 底部装饰 -->
  <g transform="translate(80, 800)">
    <text font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#b45837" letter-spacing="0.1em">
      PROMPT  ENGINEERS  STEER  WORDS
    </text>
    <text y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#26827c" letter-spacing="0.1em">
      LOOP  ENGINEERS  STEER  ITERATIONS
    </text>
    <text y="44" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f4a261" letter-spacing="0.1em">
      GRAPH  ENGINEERS  STEER  TOPOLOGY
    </text>
  </g>

  <!-- 右上 tag -->
  <g transform="translate(1380, 80)">
    <rect width="140" height="36" rx="18" fill="rgba(180,88,55,0.15)" stroke="rgba(180,88,55,0.4)" stroke-width="1"/>
    <text x="70" y="23" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#b45837" text-anchor="middle" letter-spacing="0.1em">
      RESEARCH NOTE
    </text>
  </g>
</svg>