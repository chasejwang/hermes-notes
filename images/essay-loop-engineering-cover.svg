<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f4e4d4"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#1c1a17" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- Left: Loop cycle diagram (the "ReAct" loop) -->
  <g transform="translate(180, 450)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#1c1a17" stroke-width="1" stroke-dasharray="2,4" opacity="0.4"/>
    <!-- Think node -->
    <circle cx="0" cy="-180" r="22" fill="#1c1a17"/>
    <text x="0" y="-176" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#faf8f2" text-anchor="middle">Think</text>
    <!-- Act node -->
    <circle cx="156" cy="90" r="22" fill="#1c1a17"/>
    <text x="156" y="94" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#faf8f2" text-anchor="middle">Act</text>
    <!-- Observe node -->
    <circle cx="-156" cy="90" r="22" fill="#1c1a17"/>
    <text x="-156" y="94" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#faf8f2" text-anchor="middle">Observe</text>
    <!-- Loop arrows -->
    <path d="M 18 -178 L 145 80" stroke="#b45837" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M -18 178 L -145 80" stroke="#b45837" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M 0 200 L 0 -160" stroke="#b45837" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L6,3 z" fill="#b45837"/>
      </marker>
    </defs>
  </g>

  <!-- Accent dot -->
  <g transform="translate(720, 220)">
    <circle cx="0" cy="0" r="8" fill="#b45837"/>
  </g>

  <!-- Title typography -->
  <text x="720" y="350" font-family="Georgia, serif" font-style="italic" font-size="42" fill="#1c1a17" font-weight="400">Loop Engineering</text>
  <text x="720" y="410" font-family="Georgia, serif" font-size="42" fill="#1c1a17" font-weight="400">from ReAct to Skill</text>

  <line x1="720" y1="450" x2="900" y2="450" stroke="#b45837" stroke-width="2"/>

  <text x="720" y="500" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#6a5f52">Why "ReAct loop" is no longer enough.</text>
  <text x="720" y="530" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#6a5f52">And what Voyager #1.0 +65 pts looks like.</text>

  <text x="720" y="660" font-family="monospace" font-size="13" letter-spacing="3" fill="#1c1a17">HERMES AGENT</text>
  <text x="720" y="685" font-family="monospace" font-size="13" letter-spacing="3" fill="#9a8e7e">2026 · 08 · 07</text>

  <g transform="translate(1300, 100)">
    <rect x="0" y="0" width="220" height="40" fill="none" stroke="#b45837" stroke-width="1"/>
    <text x="110" y="26" font-family="monospace" font-size="11" letter-spacing="2" fill="#b45837" text-anchor="middle">FROM 4-Q SERIES</text>
  </g>
</svg>
