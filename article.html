<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article · Hermes Notes</title>
<style>
  /* ============================================
     Indie Granola Style (taste-skill)
     ============================================ */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf8f2;
    --bg-1: #fff4e0;
    --bg-2: #f4e4d4;
    --surface: rgba(255, 251, 244, 0.7);
    --surface-2: rgba(255, 251, 244, 0.5);
    --text: #1a1814;
    --text-muted: #6a5f52;
    --text-dim: #9a8e7e;
    --border: rgba(26, 24, 20, 0.08);
    --border-strong: rgba(26, 24, 20, 0.16);
    --accent: #b45837;
    --accent-hover: #9c4a2c;
    --accent-soft: #e4b894;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Söhne', 'Inter', -apple-system, BlinkMacSystemFont,
                 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    background-image:
      radial-gradient(at 30% 0%, var(--bg-1) 0%, transparent 50%),
      radial-gradient(at 80% 20%, var(--bg-2) 0%, transparent 60%);
    background-attachment: fixed;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 24px;
  }
  .nav-brand {
    font-family: 'PP Editorial New', 'Lyon Text', Georgia, serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    letter-spacing: -0.01em;
  }
  .nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
  }
  .nav-links a {
    font-size: 14px;
    color: var(--text);
    text-decoration: none;
    opacity: 0.7;
  }
  .nav-links a:hover { opacity: 1; color: var(--accent); }

  .article {
    max-width: 680px;
    margin: 0 auto;
    padding: 80px 24px 80px;
  }
  .back-link {
    display: inline-block;
    font-size: 14px;
    color: var(--text-muted);
    text-decoration: none;
    margin-bottom: 32px;
    transition: color 0.2s;
  }
  .back-link::before {
    content: "← ";
  }
  .back-link:hover { color: var(--accent); }

  .article-tag {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .article h1 {
    font-family: 'PP Editorial New', 'Lyon Text', 'Newsreader', Georgia, serif;
    font-size: 48px;
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 20px;
  }
  .article-meta {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 32px;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .article-meta span:not(:last-child)::after {
    content: "·";
    margin-left: 16px;
    color: var(--border-strong);
  }
  .article-cover {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 36px;
    box-shadow: 0 8px 32px rgba(180, 88, 55, 0.08);
  }

  /* Audio */
  .audio-block {
    background: var(--surface);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
    margin: 36px 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6),
                0 8px 32px rgba(180, 88, 55, 0.06);
  }
  .audio-block .label {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .audio-block audio {
    width: 100%;
    height: 36px;
  }

  /* Content */
  .content {
    font-size: 18px;
    line-height: 1.7;
    color: var(--text);
    font-weight: 400;
  }
  .content h2 {
    font-family: 'PP Editorial New', 'Lyon Text', Georgia, serif;
    font-size: 28px;
    font-weight: 500;
    line-height: 1.2;
    margin: 56px 0 16px;
    letter-spacing: -0.01em;
  }
  .content h3 {
    font-family: 'PP Editorial New', 'Lyon Text', Georgia, serif;
    font-size: 22px;
    font-weight: 500;
    margin: 40px 0 10px;
    letter-spacing: -0.01em;
  }
  .content p {
    margin-bottom: 22px;
  }
  .content blockquote {
    border-left: 2px solid var(--accent);
    padding: 4px 0 4px 20px;
    margin: 32px 0;
    color: var(--text-muted);
    font-family: 'PP Editorial New', 'Lyon Text', Georgia, serif;
    font-style: italic;
    font-size: 19px;
  }
  .content ul, .content ol {
    margin: 0 0 22px 24px;
  }
  .content li {
    margin-bottom: 8px;
  }
  .content table {
    width: 100%;
    border-collapse: collapse;
    margin: 28px 0;
    font-size: 15px;
  }
  .content th, .content td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .content th {
    font-weight: 600;
    color: var(--text);
    background: var(--surface);
  }
  .content code {
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: 'SF Mono', Monaco, Consolas, monospace;
  }
  .content pre {
    background: var(--surface);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    overflow-x: auto;
    margin: 24px 0;
    font-size: 14px;
    line-height: 1.6;
  }
  .content pre code {
    background: none;
    padding: 0;
  }
  .content strong {
    font-weight: 600;
    color: var(--text);
  }
  .content em {
    font-style: italic;
    color: var(--accent);
  }

  footer {
    padding: 32px 0;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
  }
  footer em {
    font-family: 'PP Editorial New', Georgia, serif;
    font-style: italic;
    color: var(--accent);
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">Hermes Notes</a>
    <ul class="nav-links">
      <li><a href="index.html">Articles</a></li>
      <li><a href="index.html#about">About</a></li>
    </ul>
  </div>
</nav>

<article class="article" id="article">
  <a href="index.html" class="back-link">Back to essays</a>
  <div class="article-tag" id="tag">Loading...</div>
  <h1 id="title">Loading...</h1>
  <div class="article-meta" id="meta">2026-07-24 · 5 min read</div>
  <img class="article-cover" id="cover" src="" alt="" />

  <div class="audio-block">
    <div class="label">Audio version · MiniMax TTS · male-qn-jingying</div>
    <audio id="audio" controls preload="metadata">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="content" id="content">
    <p>Loading essay...</p>
  </div>
</article>

<footer>
  <p>© 2026 Hermes Notes · <em>deployed on Cloudflare Pages</em></p>
</footer>

<script>
  const articles = {
    '01': {
      tag: 'AI · RAG',
      title: 'RAG vs AutoRAG: principles, trade-offs, scenarios',
      meta: '2026-07-24 · 5 min read · audio 1:35',
      cover: 'images/01-rag.jpg',
      audio: 'audio/01-rag-summary.mp3'
    },
    '02': {
      tag: 'Investing · Method',
      title: 'Value meets quant: a personal approach',
      meta: '2026-07-24 · 6 min read · audio 1:42',
      cover: 'images/02-value.jpg',
      audio: 'audio/02-value-quant-summary.mp3'
    },
    '03': {
      tag: 'Storage · Cycle',
      title: 'Is the memory cycle peaking? Six core signals',
      meta: '2026-07-24 · 5 min read · audio 1:54',
      cover: 'images/03-memory-cycle.svg',
      audio: 'audio/03-memory-cycle-summary.mp3'
    }
  };

  const url = new URL(window.location.href);
  const id = url.searchParams.get('id') || '01';
  const article = articles[id];

  if (article) {
    document.getElementById('tag').textContent = article.tag;
    document.getElementById('title').textContent = article.title;
    document.getElementById('meta').innerHTML = article.meta.split(' · ').map(s => `<span>${s}</span>`).join('');
    document.getElementById('cover').src = article.cover;
    document.getElementById('cover').alt = article.title;
    document.getElementById('audio').src = article.audio;
    document.title = article.title + ' · Hermes Notes';
  }

  const mdFiles = {
    '01': 'articles/01-rag-vs-autorag.md',
    '02': 'articles/02-value-quant.md',
    '03': 'articles/03-memory-cycle.md'
  };

  fetch(mdFiles[id])
    .then(r => r.text())
    .then(md => {
      document.getElementById('content').innerHTML = renderMarkdown(md);
    })
    .catch(e => {
      document.getElementById('content').innerHTML = '<p>Failed to load essay.</p>';
    });

  function renderMarkdown(md) {
    let html = md;
    html = html.replace(/^---[\s\S]*?---\n/, '');

    const lines = html.split('\n');
    let inCode = false;
    let result = [];
    let skipFirstH1 = true;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];

      if (line.startsWith('```')) {
        inCode = !inCode;
        if (inCode) {
          result.push('<pre><code>');
        } else {
          result.push('</code></pre>');
        }
        continue;
      }

      if (inCode) {
        result.push(escapeHtml(line) + '\n');
        continue;
      }

      if (line.match(/^---/)) continue;

      if (skipFirstH1 && line.startsWith('# ')) {
        skipFirstH1 = false;
        continue;
      }

      if (line.startsWith('## ')) {
        result.push('<h2>' + line.slice(3) + '</h2>');
        continue;
      }
      if (line.startsWith('### ')) {
        result.push('<h3>' + line.slice(4) + '</h3>');
        continue;
      }

      if (line.startsWith('> ')) {
        result.push('<blockquote>' + line.slice(2) + '</blockquote>');
        continue;
      }

      if (line.match(/^\|.*\|/)) {
        result.push('__TABLE_START__' + line + '__TABLE_END__');
        continue;
      }

      if (line.match(/^[\-\*] /)) {
        result.push('<li>' + line.slice(2) + '</li>');
        continue;
      }
      if (line.match(/^\d+\. /)) {
        result.push('<li>' + line.replace(/^\d+\. /, '') + '</li>');
        continue;
      }

      if (line.trim() === '') {
        result.push('');
        continue;
      }

      result.push('<p>' + line + '</p>');
    }

    html = result.join('\n');

    html = html.replace(/(<li>.*?<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');

    html = html.replace(/__TABLE_START__\|(.+?)\|__TABLE_END__/g, (m, content) => {
      return '<table><tr>' + content.split('|').slice(1, -1).map(c => '<th>' + c.trim() + '</th>').join('') + '</tr></table>';
    });
    html = html.replace(/__TABLE_START__(?!\|)/g, '<tr>').replace(/__TABLE_END__/g, '</tr>');

    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    html = html.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');

    html = html.replace(/<p>(<table>.*?<\/table>)<\/p>/gs, '$1');
    html = html.replace(/<p>(<ul>.*?<\/ul>)<\/p>/gs, '$1');
    html = html.replace(/<p>(<h[23]>.*?<\/h[23]>)<\/p>/gs, '$1');
    html = html.replace(/<p>(<blockquote>.*?<\/blockquote>)<\/p>/gs, '$1');
    html = html.replace(/<p>(<pre>.*?<\/pre>)<\/p>/gs, '$1');

    return html;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>

</body>
</html>
